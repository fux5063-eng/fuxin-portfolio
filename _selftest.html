<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>全站自检</title>
<style>body{margin:0;background:#111;color:#eee;font:13px/1.7 ui-monospace,monospace}#out{padding:14px;white-space:pre-wrap}#f{position:fixed;right:0;bottom:0;width:1000px;height:800px;border:1px solid #444;opacity:.18}</style>
</head><body>
<div id="out">自检开始…</div>
<iframe id="f" src="about:blank"></iframe>
<script type="module">
const out = document.getElementById('out');
const F = document.getElementById('f');
const log = [];
const say = m => { log.push(m); out.textContent = log.join('\n'); fetch('/__log?m=' + encodeURIComponent('[SELF] ' + m), { cache: 'no-store' }).catch(() => {}); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ok = (cond, label, extra) => say((cond ? '✓ ' : '✗ ') + label + (extra ? '  ' + extra : ''));

async function loadHash(hash, waitMs = 2600) {
  F.src = '/index.html?v=' + Date.now() + hash;
  await new Promise(res => { F.onload = res; setTimeout(res, 4000); });
  await sleep(waitMs);
  return F.contentWindow;
}
async function waitFor(fn, timeoutMs = 6000, stepMs = 250) {
  const t0 = performance.now();
  while (performance.now() - t0 < timeoutMs) {
    try { if (fn()) return true; } catch (e) {}
    await sleep(stepMs);
  }
  return false;
}

try {
  say('=== 全站自检开始 ===');

  /* 1. 首页 */
  let w = await loadHash('#/');
  let d = w.document;
  ok(!!d.querySelector('.hero'), '首页 hero 存在');
  ok(!d.querySelector('.hero .m3d'), '首页首屏没有 3D 卡（用户否决过）');
  ok(d.querySelectorAll('.gate').length === 2, '两个方向入口卡', 'count=' + d.querySelectorAll('.gate').length);
  ok(d.body.classList.contains('on-home'), 'body.on-home 已设置（粒子/光标动效依赖它）');
  ok(!!d.querySelector('.marquee'), '跑马灯存在');
  ok(!!d.querySelector('.foot__qr img'), '页脚二维码已恢复');
  ok(!!d.querySelector('#modelBand .m3d'), 'REAL MODEL 区块有模型卡');
  /* 粒子是否真的在画（取画布像素） */
  let drew = false, px = 0;
  try {
    const cv = d.getElementById('fx');
    const g = cv.getContext('2d');
    const img = g.getImageData(0, 0, Math.min(300, cv.width), Math.min(300, cv.height)).data;
    for (let i = 3; i < img.length; i += 4) if (img[i] > 8) px++;
    drew = px > 5;
  } catch (e) { say('（粒子像素读取失败: ' + e.message + '）'); }
  ok(drew, '首页粒子动画在画', '非透明像素=' + px);
  /* 点击方向卡是否跳转 */
  const gate1 = d.querySelector('.gate');
  if (gate1) { gate1.click(); await sleep(1800); }
  ok(w.location.hash === '#ai' || w.location.hash === '#id', '点击方向卡后 hash 变化', 'hash=' + w.location.hash);
  ok(!!w.document.querySelector('.card, .pcard, .proj'), '点击后方向页内容已渲染');
  const hashAfter = w.location.hash;

  /* 2. 项目页（工业 DOGGIE + 落水报警终端）*/
  for (const [slug, expectParts] of [['doggie', 23], ['wateralarm', 45]]) {
    w = await loadHash('#id/' + slug, 3200);
    d = w.document;
    const secs = d.querySelectorAll('.cs__sec').length;
    ok(secs >= 3, slug + ' 案例章节数', 'secs=' + secs);
    ok(d.querySelectorAll('.rail a').length === secs, slug + ' 章节轨道项数匹配', 'rail=' + d.querySelectorAll('.rail a').length);
    ok(!!d.querySelector('.heroFig img'), slug + ' 主图存在');
    /* 先滚到模型卡附近，触发懒挂载（IntersectionObserver） */
    const card = d.querySelector('.m3d');
    if (card) { w.scrollTo(0, Math.max(0, card.getBoundingClientRect().top + w.scrollY - 300)); }
    await sleep(1200);
    const loaded = await waitFor(() => w.__m3d && w.__m3d.length && w.__m3d[0].ready, 12000);
    ok(loaded, slug + ' 3D 模型加载完成', loaded ? ('零件=' + w.__m3d[0].parts.length + ' 尺寸=' + Math.round(w.__m3d[0].modelSize) + ' 模式=' + w.__m3d[0].mode) : '超时');
    /* 模型卡是否还有"载入中"残留 */
    const stillLoading = d.querySelector('.m3d__load:not([hidden])');
    ok(!stillLoading, slug + ' 没有卡在"模型载入中"');
  }

  /* 3. 其余页面是否有明显 JS 错误（用 onerror 统计） */
  let pageErrs = 0;
  for (const h of ['#about', '#download', '#ai']) {
    w = await loadHash(h, 1500);
    w.addEventListener('error', () => pageErrs++);
    await sleep(500);
    ok(!!w.document.querySelector('#app')?.children.length, h + ' 页面有内容渲染');
  }
  ok(pageErrs === 0, '打开其它页面无 JS 错误', 'errs=' + pageErrs);

  say('=== 自检结束 ===');
} catch (e) {
  say('X · 自检脚本异常: ' + (e && (e.message || e)));
}
</script>
</body></html>
